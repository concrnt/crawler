services:
  concrnt-crawler:
    build:
      context: .
      dockerfile: ./Dockerfile
    restart: always
    depends_on:
      db:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      - CONCRNT_CRAWLER_CONFIG=/etc/concrnt-crawler/config.yaml
    volumes:
      - ./config.example.yaml:/etc/concrnt-crawler/config.yaml:ro
    networks:
      - external
      - internal

  db:
    restart: always
    image: postgres:18
    healthcheck:
      test: "pg_isready -U concrnt_crawler -d concrnt_crawler"
      interval: 5s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=concrnt_crawler
      - POSTGRES_USER=concrnt_crawler
    networks:
      - internal
      - external

  meilisearch:
    restart: always
    image: getmeili/meilisearch:v1.16
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:7700/health"]
      interval: 5s
      retries: 20
    volumes:
      - meili-data:/meili_data
    ports:
      - "7700:7700"
    environment:
      - MEILI_ENV=development
      - MEILI_NO_ANALYTICS=true
    networks:
      - internal
      - external

volumes:
  postgres-data:
  meili-data:

networks:
  external:
  internal:
    internal: true
